# Accept license: https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct
base_model: meta-llama/Llama-3.2-3B-Instruct
output_dir: ../adapters

workflow:
  train_file: ../dataset/workflow-structure.train.jsonl
  val_file: ../dataset/workflow-structure.val.jsonl
  lora_r: 16
  lora_alpha: 32
  epochs: 3
  batch_size: 2
  learning_rate: 2.0e-4
  max_seq_length: 2048

template:
  train_file: ../dataset/template-content.train.jsonl
  val_file: ../dataset/template-content.val.jsonl
  lora_r: 16
  lora_alpha: 32
  epochs: 3
  batch_size: 4
  learning_rate: 2.0e-4
  max_seq_length: 1024

qlora:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4

# Llama 3.2 LoRA targets (all linear projections in attention + MLP)
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
